# fleetboard CI 质量门禁（M7.3b）
# 触发：手动（Actions 页 workflow_dispatch）+ PR；push 不自动跑（用户要求低频）
# 注：contract job（TestContract 契约比对）随 M9.0a 落地后补入
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint / vet / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: lint (gofmt)
        run: make lint

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

  web:
    name: Web (typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: build
        working-directory: web
        run: npm run build
