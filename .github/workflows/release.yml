name: release

# 打 tag 自动发布：构建双架构二进制 + 前端，创建 Release 并上传产物；
# 同时（M9.5 后启用）自分发 arm64 APK
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 与上传产物所需

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 构建前端
        working-directory: web
        run: npm ci && npm run build

      - name: 测试与静态检查
        run: |
          go vet ./...
          go test ./...

      - name: 交叉编译（amd64 + arm64，静态链接）
        run: |
          VERSION=${GITHUB_REF_NAME}
          for a in amd64 arm64; do
            GOOS=linux GOARCH=$a CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "bin/fleetboard-linux-$a" ./cmd/server
          done

      - name: 组装发布包
        run: |
          VER=${GITHUB_REF_NAME}
          for a in amd64 arm64; do
            mkdir -p "pkg/fleetboard-$VER/web-dist"
            cp "bin/fleetboard-linux-$a" "pkg/fleetboard-$VER/fleetboard"
            cp -r web/dist/. "pkg/fleetboard-$VER/web-dist/"
            cp deploy/fleetboard.service deploy/install.sh deploy/uninstall.sh deploy/upgrade.sh deploy/.env.example "pkg/fleetboard-$VER/"
            tar czf "fleetboard-$VER-linux-$a.tar.gz" -C pkg "fleetboard-$VER"
          done
          sha256sum fleetboard-*-linux-*.tar.gz > sums.txt
          cat sums.txt

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fleetboard-*-linux-*.tar.gz
            sums.txt

  # ============================================================
  # android job（自分发 arm64 APK）
  # 当前 keystore 尚未生成（M9.5 才做），4 个 ANDROID_* secrets 为空。
  # 若直接启用，解码空 keystore 会失败并阻塞整个 release 流程，
  # 因此暂时 if: false 禁用。
  # → M9.5 生成 keystore 并配置 secrets 后，将此处改为 if: true 即可。
  # ============================================================
  android:
    if: false
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 显式 pin，与 ci.yml 保持一致
          flutter-version: '3.24.5'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: cache gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/android/**/*.gradle*', 'app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: 解码 keystore 与 key.properties
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/fleetboard.jks
          cat > app/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=fleetboard.jks
          EOF

      - name: 构建 arm64 APK
        run: cd app && flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: 生成 APK 校验和（独立文件，不并入服务端 sums.txt）
        run: |
          cd app/build/app/outputs/flutter-apk
          sha256sum app-arm64-v8a-release.apk > sums-android.txt
          cat sums-android.txt

      - name: 上传 APK 与校验和到 Release
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            app/build/app/outputs/flutter-apk/sums-android.txt
