name: release

# 打 tag 自动发布：构建双架构二进制 + 前端，创建 Release 并上传产物；
# 同时（M9.5 后启用）自分发 arm64 APK
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 与上传产物所需

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 构建前端
        working-directory: web
        run: npm ci && npm run build

      - name: 测试与静态检查
        run: |
          go vet ./...
          go test ./...

      - name: 交叉编译（amd64 + arm64，静态链接）
        run: |
          VERSION=${GITHUB_REF_NAME}
          for a in amd64 arm64; do
            GOOS=linux GOARCH=$a CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "bin/fleetboard-linux-$a" ./cmd/server
          done

      - name: 组装发布包
        run: |
          VER=${GITHUB_REF_NAME}
          for a in amd64 arm64; do
            mkdir -p "pkg/fleetboard-$VER/web-dist"
            cp "bin/fleetboard-linux-$a" "pkg/fleetboard-$VER/fleetboard"
            cp -r web/dist/. "pkg/fleetboard-$VER/web-dist/"
            cp deploy/fleetboard.service deploy/install.sh deploy/uninstall.sh deploy/upgrade.sh deploy/.env.example "pkg/fleetboard-$VER/"
            tar czf "fleetboard-$VER-linux-$a.tar.gz" -C pkg "fleetboard-$VER"
          done
          sha256sum fleetboard-*-linux-*.tar.gz > sums.txt
          cat sums.txt

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fleetboard-*-linux-*.tar.gz
            sums.txt

  # ============================================================
  # android job（自分发 arm64 APK）
  # 签名所需 4 个 secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
  #                      / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS
  # secrets 未配置时本 job 自动跳过（不阻塞 release 其余产物）；
  # 在仓库 Settings → Secrets 配好后无需再改代码，下次打 tag 即产出已签名 APK。
  # ============================================================
  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: 检查签名 secrets 是否已配置
        id: guard
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置，跳过 APK 构建（release 其余产物不受影响）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: setup flutter
        if: steps.guard.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          # 显式 pin，与 ci.yml 保持一致
          flutter-version: '3.24.5'

      - name: setup java
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: cache gradle
        if: steps.guard.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/android/**/*.gradle*', 'app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: pub get
        if: steps.guard.outputs.ready == 'true'
        working-directory: app
        run: flutter pub get

      - name: generate (freezed / json_serializable)
        if: steps.guard.outputs.ready == 'true'
        # 生成文件未入库（与 ci.yml 一致），构建前必须先生成 freezed / json_serializable 产物
        working-directory: app
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 解码 keystore 与 key.properties
        if: steps.guard.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # app/android/app/build.gradle 以 rootProject(app/android) 为基准解析 storeFile
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/fleetboard.jks
          cat > app/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=fleetboard.jks
          EOF

      - name: 构建 arm64 APK
        if: steps.guard.outputs.ready == 'true'
        # M10.2：客户端内置默认服务器地址（登录页不再手填）。
        # 仓库不保存真实地址，由 secret 注入；未配置时注入空串，App 会提示「未配置服务器地址」。
        env:
          FLEETBOARD_BASE_URL: ${{ secrets.FLEETBOARD_BASE_URL }}
        run: |
          cd app && flutter build apk --release --split-per-abi \
            --target-platform android-arm64 \
            --dart-define=FLEETBOARD_BASE_URL="$FLEETBOARD_BASE_URL"

      - name: 生成 APK 校验和（独立文件，不并入服务端 sums.txt）
        if: steps.guard.outputs.ready == 'true'
        run: |
          cd app/build/app/outputs/flutter-apk
          sha256sum app-arm64-v8a-release.apk > sums-android.txt
          cat sums-android.txt

      - name: 上传 APK 与校验和到 Release
        if: steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            app/build/app/outputs/flutter-apk/sums-android.txt
