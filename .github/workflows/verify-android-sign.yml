name: verify-android-sign

# 手动触发：校验 ANDROID_* secrets 与 release.yml 的 android job 端到端可用。
#   job 1 verify    ：keystore 能否解出、证书指纹是否与记录一致、key 密码是否可用（1 分钟）
#   job 2 build-apk ：按 release.yml 同样的步骤真构建一次 arm64 APK 并验签（约 8-12 分钟）
# 不创建 Release、不发版，产物只作为 workflow artifact（保留 7 天）。
# 用途：换 keystore / 改密码 / 改签名配置后先跑这个，再打 tag。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 解码 keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/fleetboard.jks
          ls -l /tmp/fleetboard.jks

      - name: 校验 keystore 文件哈希
        run: |
          # 与仓库外备份 fleetboard.jks 的哈希比对，确认 base64 往返无损
          echo "1f79c0b1985bdbb903b89507dbe24b34303af49ddae015256a2dc29eefbef0e3  /tmp/fleetboard.jks" | sha256sum -c -

      - name: 校验 alias、store 密码与证书指纹
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore /tmp/fleetboard.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | tee /tmp/k.txt
          if ! grep -qi "3E:CD:40:A6:2C:BF:9B:BE:0C:3F:E3:6E:6B:A1:0A:96:75:4B:BF:FB:EB:1C:8C:BB:E7:C8:37:9E:54:6C:63:42" /tmp/k.txt; then
            echo "::error::证书 SHA-256 与记录不符，keystore 可能不是发布用的那一份"
            exit 1
          fi

      - name: 校验 key 密码（能签出 CSR 即密码正确）
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -certreq -alias "$KEY_ALIAS" -keystore /tmp/fleetboard.jks \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -file /tmp/probe.csr >/dev/null
          test -s /tmp/probe.csr && echo "key 密码正确，可正常签名"
          rm -f /tmp/fleetboard.jks /tmp/probe.csr /tmp/k.txt

      - name: 结论
        run: echo "✅ 4 个 ANDROID_* secrets 内容正确"

  # 与 release.yml android job 同步骤，只是不上传 Release —— 用来验证签名配置真的能出包。
  build-apk:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: cache gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/android/**/*.gradle*', 'app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: generate (freezed / json_serializable)
        working-directory: app
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 解码 keystore 与 key.properties（与 release.yml 同逻辑）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/fleetboard.jks
          cat > app/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=fleetboard.jks
          EOF

      - name: 构建 arm64 APK
        run: cd app && flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: 验证 APK 签名
        run: |
          APK=app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -l "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BT}apksigner" verify --print-certs "$APK" | tee /tmp/apk.txt
          # apksigner 输出的是「无冒号、小写」的 SHA-256，需规范化后再比对
          FP=$(grep -i "certificate SHA-256 digest" /tmp/apk.txt | head -1 \
               | sed 's/.*digest: *//' | tr -d ':' | tr 'a-f' 'A-F')
          EXPECT=3ECD40A62CBF9BBE0C3FE36E6BA10A96754BBFFBEB1C8CBBE7C8379E546C6342
          echo "APK 证书 SHA-256：$FP"
          if [ "$FP" != "$EXPECT" ]; then
            echo "::error::APK 签名证书指纹与记录不符（期望 $EXPECT）"
            exit 1
          fi
          echo "✅ APK 已用发布 keystore 正确签名"
          sha256sum "$APK" > sums-android.txt
          cat sums-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apk-signed-${{ github.run_id }}
          retention-days: 7
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            sums-android.txt
