# fleetboard 实时传输契约（M9.0a 附属）
# 与 api/openapi.yaml 互补：描述非普通 request/response 的传输通道。
# contract_test.go 解析本文件所有带 x-transport 的路径，确认其在 engine.Routes() 中存在（路径级哨兵）。
openapi: 3.0.3
info:
  title: fleetboard Realtime Contract
  version: M9.0b

components:
  schemas:
    LogChunk:
      type: object
      properties:
        ts: { type: string, format: date-time, description: 日志时间戳 }
        stream: { type: string, enum: [stdout, stderr], description: 输出流 }
        text: { type: string, description: 日志文本行 }
    TermFrame:
      type: object
      properties:
        t: { type: string, enum: [i, o, r, x, e, p], description: 帧类型 }
        d: { type: string, description: base64 编码的输入/输出字节 }
        c: { type: integer, description: 列数（t=r 时） }
        r: { type: integer, description: 行数（t=r 时） }
        code: { type: integer, description: 退出码（t=x 时） }
        m: { type: string, description: 错误文案（t=e 时） }
    SseEvent:
      type: object
      properties:
        type: { type: string, description: 事件类型，如 progress/done/error }
        payload: { type: object, description: 事件载荷，与 Job 状态对齐 }

paths:
  # ===== 容器日志：WebSocket（App 可直连带 Authorization: Bearer 绕过 logs-ticket）=====
  /api/servers/{id}/containers/{cid}/logs:
    get:
      operationId: containerLogsWS
      x-transport: websocket
      summary: >
        容器日志实时流。握手带 `Authorization: Bearer <token>`（App 直连场景）；
        浏览器经 logs-ticket 换一次性票据亦可。对应 gin 路由 GET /api/servers/:id/containers/:cid/logs。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: cid, in: path, required: true, schema: { type: string } }
      messages:
        - $ref: '#/components/schemas/LogChunk'

  # ===== 交互式终端：WebSocket（双向字节流 + PTY resize）=====
  #
  # 帧格式（JSON 文本帧，载荷 base64）：
  #   客户端 → 服务端 {"t":"i","d":"<base64>"} 输入字节 / {"t":"r","c":120,"r":30} 尺寸
  #   服务端 → 客户端 {"t":"o","d":"<base64>"} 输出字节 / {"t":"x","code":0} 结束 / {"t":"e","m":"..."} 错误
  # 为什么 base64：PTY 输出是任意字节，单帧可能切在多字节字符中间，
  # 按字符串逐帧传会把中文变成 U+FFFD。
  /api/servers/{id}/terminal:
    get:
      operationId: serverTerminalWS
      x-transport: websocket
      summary: >
        交互式 shell。握手必须带 `Authorization: Bearer <token>`（App 直连；
        不支持 ticket 换票——票据是为无法自定义头的浏览器准备的，终端只服务 App）。
        单机并发上限 3，单会话最长 4 小时，空闲靠 ping/pong 回收。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      messages:
        - $ref: '#/components/schemas/TermFrame'

  # ===== 软件包更新：SSE（text/event-stream，M9.0b 双通道之一）=====
  /api/servers/{id}/packages/update:
    post:
      operationId: packageUpdateSSE
      x-transport: sse
      summary: >
        Server-Sent Events 实时流，Content-Type: text/event-stream。
        本请求同时触发后台任务并立即 202 + Location:/api/jobs/{id}（见 openapi.yaml）。
        对应 gin 路由 POST /api/servers/:id/packages/update。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      messages:
        - $ref: '#/components/schemas/SseEvent'

  # ===== 文件分片上传：原始字节流 + offset（App 已消费）=====
  /api/servers/{id}/files/upload:
    post:
      operationId: uploadFileChunked
      x-transport: http
      x-upload-protocol: raw-bytes-offset
      summary: >
        分片上传：请求体是原始字节（Content-Type: application/octet-stream），
        从 offset 查询参数指定的位置开始写，返回 {path, offset, written}。
        对应 gin 路由 POST /api/servers/:id/files/upload。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: path, in: query, required: true, schema: { type: string } }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
          description: 本次写入的起始字节偏移；分片上传时由客户端累加
