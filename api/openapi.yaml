  # ===== 告警 =====
  /api/alert-rules:
    get:
      operationId: listAlertRules
      tags: [alerts]
      x-app-consumed: true
      summary: 告警规则列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
    post:
      operationId: createAlertRule
      tags: [alerts]
      x-app-consumed: true
      summary: 新建告警规则
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/alert-rules/{id}:
    put:
      operationId: updateAlertRule
      tags: [alerts]
      x-app-consumed: true
      summary: 部分更新告警规则（merge 语义：未传字段保持原值）
      description: |
        与 `PUT /api/settings` 一致采用 merge 语义，而不是全量替换：
        App 里「改阈值」与「开关规则」是两个独立入口，全量替换会让漏传的字段被清空。
        `server_id` 不可修改——改归属等同删旧建新，会让历史通知指向语义已变的规则。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metric: { type: string, enum: [cpu_pct, mem_pct, disk_pct, offline] }
                operator: { type: string, enum: ['>', '>=', '<', '<=', '='] }
                threshold: { type: number, minimum: 0, maximum: 100 }
                severity: { type: string, enum: [info, warn, critical] }
                enabled: { type: boolean }
                notify_channels: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '400': { description: 字段非法或试图修改 server_id }
        '404': { description: 规则不存在 }
    delete:
      operationId: deleteAlertRule
      tags: [alerts]
      x-app-consumed: true
      summary: 删除告警规则
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      x-app-consumed: true
