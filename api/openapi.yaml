# fleetboard OpenAPI 契约（M9.0a）
# 作用：CI 路由比对哨兵的事实源（internal/api/contract_test.go 读取本文件与 engine.Routes() 双向比对）。
# 覆盖全部后端端点（含 M9.0b 新增：/api/bootstrap、/api/jobs/{id}、/api/servers/{id}/packages/update；
# 含 M7 新增：/api/system/upgrade、/api/system/upgrade/status 面板自更新）。
# 约定：x-app-consumed=true 表示 App 首版消费；files/compose 域为 false（仍入哨兵）。
# 不生成 Dart（仅作 CI 比对与文档）。
openapi: 3.0.3
info:
  title: fleetboard API
  version: M9.0b
  description: 单机/多服务器 Docker 运维面板后端契约。
servers:
  - url: /api
tags:
  - name: system
  - name: auth
  - name: servers
  - name: containers
  - name: images
  - name: networks
  - name: volumes
  - name: metrics
  - name: alerts
  - name: settings
  - name: packages
  - name: files
  - name: compose
  - name: jobs

components:
  schemas:
    ApiEnvelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 业务码，0=成功，非0与 HTTP 状态对齐
        msg:
          type: string
        data:
          type: object
          nullable: true
          description: 业务载荷，失败时可能省略
    Server:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        ssh_user: { type: string }
        auth_method: { type: string, enum: [password, key] }
        connection_status: { type: string, enum: [online, offline, unknown] }
        last_heartbeat: { type: string, format: date-time, nullable: true }
        tags: { type: string }
        created_at: { type: string, format: date-time }
    ServerMetric:
      type: object
      properties:
        id: { type: integer }
        server_id: { type: integer }
        ts: { type: string, format: date-time }
        cpu_pct: { type: number }
        mem_pct: { type: number }
        disk_pct: { type: number }
        load1: { type: number }
        net_in_kbps: { type: number }
        net_out_kbps: { type: number }
    Container:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        state: { type: string }
        status: { type: string }
        created_at: { type: string }
        ports: { type: string }
    AlertRule:
      type: object
      properties:
        id: { type: integer }
        server_id: { type: integer, nullable: true }
        metric: { type: string }
        operator: { type: string }
        threshold: { type: number }
        severity: { type: string }
        enabled: { type: boolean }
        notify_channels: { type: string }
        created_at: { type: string, format: date-time }
    AlertEvent:
      type: object
      properties:
        id: { type: integer }
        server_id: { type: integer, nullable: true }
        rule_id: { type: integer, nullable: true }
        severity: { type: string }
        title: { type: string }
        message: { type: string }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }
    UpgradeRecord:
      type: object
      description: 面板自更新历史（system_upgrades 一行）
      properties:
        id: { type: integer }
        from_version: { type: string }
        to_version: { type: string }
        status:
          type: string
          enum: [in_progress, done, failed, rolled_back, interrupted]
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        duration_ms: { type: integer }
        error_code: { type: string }
        triggered_by: { type: integer, nullable: true }
        log_path: { type: string }
    UpgradeInfo:
      type: object
      description: 版本与可升级性（GET /api/system/upgrade 的 data）
      properties:
        current_version: { type: string }
        latest_version: { type: string }
        upgrade_enabled: { type: boolean, description: 配置开关 SELF_UPGRADE }
        can_upgrade: { type: boolean, description: 开关开 + 有新版 + 无在途升级 + 环境满足 }
        reason: { type: string, description: 不可升级时的中文原因，可升级时为空串 }
        last: { allOf: [{ $ref: '#/components/schemas/UpgradeRecord' }], nullable: true }
    UpgradeStatus:
      type: object
      description: 升级阶段与日志尾（POST 202 与 GET status 共用）
      properties:
        state:
          type: string
          description: 编排层状态（verifying=取包/sha256，backing_up=备份数据库，health_check=健康检查）
          enum: [idle, requested, verifying, stopping, backing_up, replacing, starting, health_check, done, failed, rolled_back, interrupted]
        phase_text: { type: string }
        from: { type: string }
        to: { type: string }
        error_code: { type: string }
        log_tail: { type: array, items: { type: string }, description: 日志末 20 行 }
    Job:
      type: object
      properties:
        jobId: { type: string }
        kind: { type: string }
        status: { type: string, enum: [pending, running, done, failed, cancelled] }
        serverId: { type: integer }
        uid: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines: { type: array, items: { type: string } }
        error: { type: string, nullable: true }
    UnusedVolume:
      type: object
      properties:
        name: { type: string }
        compose_project:
          type: string
          description: 卷所属 compose 项目（label com.docker.compose.project）；空=非 compose 卷
    VolumePreview:
      type: object
      description: 未使用卷预览（GET /api/servers/{id}/docker/unused-volumes 的 data）
      properties:
        volumes:
          type: array
          items: { $ref: '#/components/schemas/UnusedVolume' }
        count: { type: integer, description: 未使用卷数量（=len(volumes)） }
        total_count: { type: integer, description: 该机卷总数（含被引用的） }
        in_use_count: { type: integer, description: 仍被容器引用（含已停止容器）的卷数 }
        reclaimable:
          type: string
          description: 与 docker system df 的 Local Volumes 行同源；取不到为空串
        prune_command: { type: string, description: 确认后实际执行的命令 }
        snapshot_at: { type: string, format: date-time, description: 清单快照时间 }
    PruneResult:
      type: object
      description: 单个清理目标的执行结果；error 非空表示该项失败，其余项照常完成
      properties:
        target: { type: string, enum: [images, volumes, build_cache] }
        command: { type: string }
        mode:
          type: string
          enum: [dangling, all_unused]
          description: dangling=只删悬空对象；all_unused=删全部无引用对象（含命名卷）
        output: { type: string }
        reclaimed: { type: string, description: '如 85.94MB；解析不到时为空串' }
        deleted_items:
          type: array
          items: { type: string }
          description: 实际删除的条目（卷名 / 镜像引用 / 缓存 ID）
        deleted_count: { type: integer }
        nothing_deleted:
          type: boolean
          description: true=本次没有可删项，与「删了但回收 0B」严格区分
        error: { type: string, description: 该项失败原因；空串表示成功 }
    DiskUsage:
      type: object
      description: docker system df 的一行
      properties:
        type: { type: string }
        total_count: { type: string }
        active: { type: string }
        size: { type: string }
        reclaimable: { type: string }
        prune_target: { type: string, description: 对应 prune 目标；空=无（如 Containers） }
        prune_coverage:
          type: string
          enum: [full, partial, none]
          description: full=可被对应 prune 完全清除；partial=只能清一部分（Images 行）

paths:
  # ===== 系统 / 公开 =====
  /api/health:
    get:
      operationId: getHealth
      tags: [system]
      x-app-consumed: true
      summary: 健康检查（公开）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/bootstrap:
    get:
      operationId: getBootstrap
      tags: [system]
      x-app-consumed: true
      summary: 首屏聚合（M9.0b）：服务器列表+最新指标+未读告警+版本/schema
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/audit:
    get:
      operationId: listAudit
      tags: [system]
      x-app-consumed: true
      summary: 操作审计日志
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  # ===== 面板自更新（M7）：App 可查询 / 触发 / 跟踪 =====
  /api/system/upgrade:
    get:
      operationId: getSystemUpgrade
      tags: [system]
      x-app-consumed: true
      summary: 版本与可升级性（latest 取 GitHub Releases，5s 超时 + 10min 进程内缓存，失败降级不 5xx）
      responses:
        '200':
          description: 成功（开关关闭时同样 200，can_upgrade=false 并用 reason 说明）
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UpgradeInfo' }
    post:
      operationId: triggerSystemUpgrade
      tags: [system]
      x-app-consumed: true
      summary: 触发面板自更新（密码二次确认 + 幂等头 + 审计）
      parameters:
        - { name: X-Client-Op-Id, in: header, required: true, schema: { type: string }, description: 客户端操作唯一 ID，用于幂等与审计关联 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: 当前登录用户密码，二次确认用 }
                target_version: { type: string, description: 目标版本，省略则取 latest }
      responses:
        '202':
          description: '已受理（Location: /api/system/upgrade/status）'
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UpgradeStatus' }
        '400': { description: 缺 X-Client-Op-Id 或密码 }
        '401': { description: 密码错误或退避中 }
        '404': { description: 本实例未开启面板自更新 }
        '409': { description: 已有升级在进行 / 环境不满足 / 目标版本不高于当前 }
  /api/system/upgrades:
    get:
      operationId: listSystemUpgrades
      tags: [system]
      x-app-consumed: true
      summary: 升级历史分页（升级历史页用；开关关闭时 404）
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiEnvelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/UpgradeRecord' }
                          total: { type: integer, description: 全量总数，用于算是否还有下一页 }
                          limit: { type: integer }
                          offset: { type: integer }
        '400': { description: limit/offset 非法 }
        '404': { description: 本实例未开启面板自更新 }
  /api/system/upgrade/status:
    get:
      operationId: getSystemUpgradeStatus
      tags: [system]
      x-app-consumed: true
      summary: 升级阶段与日志尾（App 轮询跟踪）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UpgradeStatus' }
        '404': { description: 本实例未开启面板自更新 }

  # ===== 认证 =====
  /api/login:
    post:
      operationId: login
      tags: [auth]
      x-app-consumed: true
      summary: 登录（返回 token，data 含 refresh_expires_at 向后兼容）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      x-app-consumed: true
      summary: 刷新 token（data 含 refresh_expires_at 向后兼容）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/me:
    get:
      operationId: getMe
      tags: [auth]
      x-app-consumed: true
      summary: 当前用户
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      x-app-consumed: true
      summary: 修改密码（并使旧 token 失效）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/auth/change-username:
    post:
      operationId: changeUsername
      tags: [auth]
      x-app-consumed: true
      summary: 修改用户名（验当前密码；不重签 token、不动 token_ver）
      description: |
        用户名会出现在登录页/设置页/审计里，按纯文本展示，故限制为
        3–32 位、以字母或数字开头、只允许 `[A-Za-z0-9_.-]`。
        重名判定大小写不敏感；并发窗口由 users.username 的 UNIQUE 约束兜底。
        改名不影响鉴权（JWT claims 只有 uid/typ/ver），客户端显示名经 `GET /api/me` 刷新。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_username, current_password]
              properties:
                new_username: { type: string }
                current_password: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '400': { description: 格式非法或与当前用户名相同 }
        '401': { description: 当前密码错误 }
        '409': { description: 用户名已被占用 }

  # ===== 服务器管理 =====
  /api/servers:
    get:
      operationId: listServers
      tags: [servers]
      x-app-consumed: true
      summary: 列出被管服务器
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
    post:
      operationId: createServer
      tags: [servers]
      x-app-consumed: true
      summary: 新增服务器
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/servers/{id}:
    get:
      operationId: getServer
      tags: [servers]
      x-app-consumed: true
      summary: 服务器详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
    delete:
      operationId: deleteServer
      tags: [servers]
      x-app-consumed: true
      summary: 删除服务器
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/servers/{id}/test:
    post:
      operationId: testServer
      tags: [servers]
      x-app-consumed: true
      summary: 测试 SSH 连通性
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  # ===== 容器 =====
  /api/servers/{id}/containers:
    get:
      operationId: listContainers
      tags: [containers]
      x-app-consumed: true
      summary: 容器列表
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/servers/{id}/containers/{cid}/actions:
    post:
      operationId: containerAction
      tags: [containers]
      x-app-consumed: true
      summary: 容器操作（start/stop/restart/...）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: cid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/servers/{id}/containers/{cid}/logs-ticket:
    post:
      operationId: logsTicket
      tags: [containers]
      x-app-consumed: true
      summary: 签发日志流一次性 ticket（浏览器 WS 用）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: cid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/servers/{id}/containers/{cid}/logs:
    get:
      operationId: containerLogs
      tags: [containers]
      x-app-consumed: true
      summary: 容器日志流（WS，App 可直连带 Bearer 绕过 logs-ticket；详见 realtime-contract.yaml）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: cid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 升级为 WebSocket
  /api/servers/{id}/container-stats:
    get:
      operationId: containerStats
      tags: [containers]
      x-app-consumed: true
      summary: 容器实时资源统计
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  # ===== 镜像 =====
  /api/servers/{id}/images:
    get:
      operationId: listImages
      tags: [images]
      x-app-consumed: true
      summary: 镜像列表
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/servers/{id}/images/pull:
    post:
      operationId: pullImage
      tags: [images]
      x-app-consumed: true
      summary: 拉取镜像
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/servers/{id}/images/{imageId}:
    delete:
      operationId: removeImage
      tags: [images]
      x-app-consumed: true
      summary: 删除镜像
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: imageId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  # ===== 网络 / 卷 =====
  /api/servers/{id}/networks:
    get:
      operationId: listNetworks
      tags: [networks]
      x-app-consumed: true
      summary: 网络列表
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
  /api/servers/{id}/volumes:
    get:
      operationId: listVolumes
      tags: [volumes]
      x-app-consumed: true
      summary: 卷列表
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /api/servers/{id}/volumes/{name}:
    delete:
      operationId: removeVolume
      tags: [volumes]
      x-app-consumed: true
      summary: 删除数据卷（卷内数据一并删除；被容器占用时返回 409）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '409':
          description: 卷仍被容器占用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /api/servers/{id}/docker/df:
    get:
      operationId: dockerDiskUsage
      tags: [volumes]
      x-app-consumed: true
      summary: Docker 空间占用与可回收量（docker system df）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /api/servers/{id}/docker/unused-volumes:
    get:
      operationId: previewUnusedVolumes
      tags: [volumes]
      x-app-consumed: true
      summary: 预览将被回收的未使用卷（含命名卷 / compose 卷），供执行前确认
      description: 只读。清单与 docker volume prune -a -f 的删除集合等价（同一 dangling 判据）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 成功，data 为 VolumePreview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /api/servers/{id}/docker/prune:
    post:
      operationId: pruneDocker
      tags: [volumes]
      x-app-consumed: true
      summary: 回收 Docker 磁盘空间（悬空镜像 / 全部未使用卷（含命名卷，需 -a）/ 构建缓存）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets:
                  type: array
                  items: { type: string, enum: [images, volumes, build_cache] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  # ===== 监控指标 =====
  /api/servers/{id}/metrics:
